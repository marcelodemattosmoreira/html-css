<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste Formulário</title>
</head>
<body>
    <fieldset>
        <legend>Formulário</legend>
        <form action="cadastro.php" method="get" autocomplete="on">
            <p>
                <label for="inome">Nome</label>
                <input type="text" name="nome" id="inome required" autocomplete="name">
            </p>
            <p>
                <label for="iemail">E-mail</label>
                <input type="text" name="email" id="iemail" required autocomplete="email">
            </p>
            <p>
                <label for="itel">Telefone</label>
                <input type="tel" name="tel" id="itel" autocomplete="tel" pattern="^\(\d{2}\)\d{4,5}-d{4}$" required placeholder="(xx)-xxxxxxxxx">
            </p>
            <input type="submit" value="Enviar">
            <input type="reset" value="limpar">
        </form>
    </fieldset>
    
</body>
</html>
