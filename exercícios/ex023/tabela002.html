<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela Simples</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
            font-size: 20px;
        }
        table{
            width: 500px;
            height: 500px;
            border: 3px solid black;
            border-collapse: collapse;
        }
        td{
            border: 2px solid black;
        }
        .tr1{
            text-align: right;
        }
        .tr2{
            vertical-align: top;
        }

    </style>
</head>
<body>
    <h1>Tabela simples 02</h1>
    <table>
        <tr class="tr1" >
            <td>A1</td>
            <td>B1</td>
            <td>C1</td>
        </tr>
        <tr class="tr2">
            <td>A2</td>
            <td>B2</td>
            <td>C2</td>
        </tr>
        <tr class="tr1 tr2">
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
    </table>
    
</body>
</html>
