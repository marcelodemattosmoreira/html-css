<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Grandes</title>
    <style>
        *{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
        }
        thead,tfoot{
            background-color: rgba(128, 128, 128, 0.527);
            color: rgb(255, 255, 255);
        }
        td,th{
            border: 2px solid black;
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>Tabelas Grandes</h1>
    <table>
        <thead>
            <th>Rank</th>
            <th>Unidade Federativa</th>
            <th>População</th>
            <th>% Total</th>
        </thead>
        <tbody>
            <tr>
                <th>1°</th>
                <td>São Paulo (SP)</td>
                <td>46 081 801</td>
                <td>21,59%</td>
            </tr>
            <tr>
                <th>2°</th>
                <td>Minas Gerais (MG)</td>
                <td>21 393 441</td>
                <td>10,02%</td>
            </tr>
            <tr>
                <th>3°</th>
                <td>Rio de Janeiro</td>
                <td>17 223 547</td>
                <td>8,07%</td>
            </tr>
            <tr>
                <th>4°</th>
                <td>Bahia</td>
                <td>14 870 907</td>
                <td>6,97%</td>
            </tr>
            <tr>
                <th>5°</th>
                <td>Paraná</td>
                <td>11 890 517</td>
                <td>5,57%</td>
            </tr>
        </tbody>
        <tfoot>
            <th>#</th>
            <td>Total</td>
            <td>213 421 037</td>
            <td>100%</td>
        </tfoot>
    </table>
    
</body>
</html>
