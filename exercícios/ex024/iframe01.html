<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>estudo de iframes</title>
</head>
<body>
    <h1>Testando o uso de um iframe</h1>
    <!--Tamanho padrão do iframe 300x150-->
    <p>Acessando o site do <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500px"></iframe> para aprender a programar,</p> <p>tem navegadores de celulares que também nao aceitam o iframe uma solução e <a href="https://www.cursoemvideo.com" target="_blank"></a></p> 
    <p>Acessando o site do <iframe src="https://www.google.com" frameborder="0"></iframe> tem sites que nao aceitam o iframe.</p> 
</body>
</html>
